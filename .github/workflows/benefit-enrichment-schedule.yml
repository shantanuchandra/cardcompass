name: Schedule benefit enrichment

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: cardcompass-issuer-crawl
  cancel-in-progress: false

jobs:
  enrich-benefits:
    if: github.event_name == 'workflow_dispatch' || vars.CARD_INGESTION_V6_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      BENEFIT_ENRICHMENT_CRON_SECRET: ${{ secrets.BENEFIT_ENRICHMENT_CRON_SECRET }}
    steps:
      - name: Initialize the reviewed five-card v6 pilot
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body --connect-timeout 10 --max-time 240 --retry 2 \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "x-cardcompass-cron-secret: ${BENEFIT_ENRICHMENT_CRON_SECRET}" \
            --data '{"action":"initialize_pilot","parserVersion":"benefits-v6","candidates":[{"id":"f73c07e2-3385-4330-ba2b-1409d2c1ee8a","issuer":"Axis Bank","active":true,"approvedUrl":true,"profile":"straightforward"},{"id":"70886874-05b0-447c-834b-577e2ffe90d9","issuer":"HDFC Bank","active":true,"approvedUrl":true,"profile":"redirect_or_js"},{"id":"6acbfb1d-8103-4b37-ba3f-df0634dfafac","issuer":"SBI Card","active":true,"approvedUrl":true,"profile":"terms_linked"},{"id":"8cbddc7f-14bc-46e5-a724-be6ab724cb84","issuer":"ICICI Bank","active":true,"approvedUrl":false,"profile":"known_invalid"},{"id":"b71803f9-2120-4ee3-8f99-5c1e9313953f","issuer":"IDFC FIRST Bank","active":true,"approvedUrl":true,"profile":"additional_valid"}]}' \
            --output "$response_file" \
            "${SUPABASE_URL}/functions/v1/benefit-enrichment-batch"

          node -e '
            const payload = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (payload?.status === "paused") {
              console.log("Scheduled enrichment is paused by the database runtime control");
              process.exit(0);
            }
            if (!payload || typeof payload.runId !== "string" ||
                !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(payload.runId)) {
              throw new Error("Batch response is missing a valid runId");
            }
            console.log(`Scheduled enrichment run: ${payload.runId}`);
          ' "$response_file"
