name: Schedule benefit enrichment

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: Benefit enrichment run mode
        required: true
        default: scheduled
        type: choice
        options:
          - scheduled
          - pilot

concurrency:
  group: cardcompass-issuer-crawl
  cancel-in-progress: false

jobs:
  enrich-benefits:
    if: github.event_name == 'workflow_dispatch' || vars.CARD_INGESTION_V6_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      BENEFIT_ENRICHMENT_CRON_SECRET: ${{ secrets.BENEFIT_ENRICHMENT_CRON_SECRET }}
    steps:
      - name: Process one benefit enrichment job
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          run_mode="${{ github.event_name == 'workflow_dispatch' && inputs.run_mode || 'scheduled' }}"
          retry_count=2
          if [[ "$run_mode" == "pilot" ]]; then
            retry_count=0
          fi

          curl --fail-with-body --connect-timeout 10 --max-time 240 --retry "$retry_count" \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "x-cardcompass-cron-secret: ${BENEFIT_ENRICHMENT_CRON_SECRET}" \
            --data "{\"runMode\":\"${run_mode}\"}" \
            --output "$response_file" \
            "${SUPABASE_URL}/functions/v1/benefit-enrichment-batch"

          node -e '
            const payload = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (payload?.status === "paused") {
              console.log("Scheduled enrichment is paused by the database runtime control");
              process.exit(0);
            }
            if (!payload || typeof payload.runId !== "string" ||
                !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(payload.runId)) {
              throw new Error("Batch response is missing a valid runId");
            }
            console.log(`Scheduled enrichment run: ${payload.runId}`);
          ' "$response_file"
