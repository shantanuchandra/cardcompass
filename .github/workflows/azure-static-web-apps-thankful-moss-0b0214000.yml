name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - prod
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - prod

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run landing, GTM, and static migration tests
        run: node --test test/landing/*.test.js test/gtm/*.test.js test/supabase/*_test.js

      - name: Analyze Flutter
        # Existing repository-wide lint debt and the legacy widget harness are
        # tracked separately; new compile errors in owned runtime/test paths fail.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test/core test/features

      - name: Run focused Flutter tests
        run: flutter test test/core test/features

      - name: Write dart_defines.json from secrets
        run: |
          cat > dart_defines.json <<EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "GOOGLE_CLIENT_ID": "${{ secrets.GOOGLE_CLIENT_ID }}"
          }
          EOF

      - name: Validate browser Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/write-landing-env.mjs /tmp/cardcompass-public-env.js

      - name: Build Flutter web
        run: flutter build web --release --base-href /app/ --dart-define-from-file=dart_defines.json

      - name: Assemble deploy directory
        run: |
          mkdir -p deploy
          # Landing page at root (/)
          cp -r landing/* deploy/
          rm -f deploy/design-system.html deploy/design-system.css
          # Flutter app under /app/
          cp -r build/web deploy/app
          # Azure SWA routing config
          cp staticwebapp.config.json deploy/

      - name: Generate landing environment module
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/write-landing-env.mjs deploy/env.js

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_MOSS_0B0214000 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "deploy"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_MOSS_0B0214000 }}
          action: "close"
