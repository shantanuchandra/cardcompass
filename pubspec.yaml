name: cardcompass
description: "CardCompass — Every Swipe, Optimised."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.10.3

  # Auth
  google_sign_in: ^6.2.2
  googleapis: ^16.0.0

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  fl_chart: ^0.70.2

  # Web platform APIs
  web: ^1.1.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  http: ^1.3.0

  # PDF statement parsing
  syncfusion_flutter_pdf: ^34.1.30

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
