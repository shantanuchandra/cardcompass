<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — CardCompass</title>
  <meta name="description" content="Sign in to CardCompass, your AI-powered credit card rewards co-pilot." />
  <meta name="robots" content="noindex" />

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Radial glow — behind card, centered -->
  <div class="glow" aria-hidden="true"></div>

  <main class="page-wrap">

    <!-- Wordmark + tagline above card -->
    <header class="brand">
      <div class="wordmark">
        <svg class="compass-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="#15803D" stroke-width="1.6"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2" stroke="#15803D" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M15.5 8.5L13 13l-4.5 2.5L11 11l4.5-2.5z" fill="#15803D"/>
        </svg>
        CardCompass
      </div>
      <p class="tagline">AI-powered card rewards</p>
    </header>

    <!-- Sign-in card -->
    <section class="card" role="main">
      <h1 class="card-heading">Sign in to CardCompass</h1>
      <p class="card-subtitle">Your AI rewards co-pilot</p>

      <!-- Google OAuth button -->
      <button
        id="google-btn"
        class="google-btn"
        type="button"
        aria-label="Sign in with Google"
      >
        <!-- Google G logo (official 4-color) -->
        <span class="google-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19.6 10.23c0-.68-.06-1.36-.18-2H10v3.79h5.4a4.62 4.62 0 0 1-2 3.03v2.52h3.24c1.9-1.75 3-4.33 3-7.34z" fill="#4285F4"/>
            <path d="M10 20c2.7 0 4.97-.9 6.62-2.43l-3.23-2.51c-.9.6-2.04.96-3.39.96-2.6 0-4.8-1.76-5.6-4.12H1.07v2.6A10 10 0 0 0 10 20z" fill="#34A853"/>
            <path d="M4.4 11.9A6.03 6.03 0 0 1 4.08 10c0-.66.11-1.3.32-1.9V5.5H1.07A10 10 0 0 0 0 10c0 1.61.38 3.13 1.07 4.5l3.33-2.6z" fill="#FBBC05"/>
            <path d="M10 3.98c1.47 0 2.79.51 3.83 1.5l2.87-2.87C14.97.99 12.7 0 10 0A10 10 0 0 0 1.07 5.5l3.33 2.6C5.2 5.74 7.4 3.98 10 3.98z" fill="#EA4335"/>
          </svg>
        </span>

        <!-- Loading spinner (hidden by default) -->
        <span class="spinner" aria-hidden="true" id="spinner">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="8" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
            <path d="M10 2a8 8 0 0 1 8 8" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>

        <span class="btn-text">Continue with Google</span>
      </button>

      <!-- Error message (hidden by default) -->
      <p class="error-msg" id="error-msg" role="alert" aria-live="polite"></p>

      <!-- Security line -->
      <p class="security-line">
        <svg width="13" height="14" viewBox="0 0 13 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M6.5 1L1 3.5v3.25C1 9.9 3.47 12.6 6.5 13c3.03-.4 5.5-3.1 5.5-6.25V3.5L6.5 1z" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M4 7l1.5 1.5L9 5.5" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Read-only Gmail &middot; No card data stored
      </p>
    </section>

    <!-- Back link -->
    <a href="https://www.cardcompass.in" class="back-link">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M9 3L5 7l4 4" stroke="rgba(255,255,255,0.4)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to cardcompass.in
    </a>

  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
